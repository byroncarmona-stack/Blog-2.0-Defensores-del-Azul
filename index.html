<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Club Defensores del Azul | Del territorio al dato</title>

<meta name="description" content="Club Defensores del Azul - Institución Educativa Pueblo Rico, Neira, Caldas. Conocemos, investigamos y protegemos el agua.">

<style>

:root{
--azul:#07566b;
--azul2:#0b7f91;
--verde:#23865b;
--verde2:#62b879;
--agua:#e9f7f7;
--fondo:#f7fbfa;
--texto:#173b45;
--blanco:#ffffff;
--borde:#dceceb;
--sombra:0 10px 30px rgba(9,66,75,.10);
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html{
scroll-behavior:smooth;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:var(--fondo);
color:var(--texto);
line-height:1.65;
}

a{
text-decoration:none;
color:inherit;
}

img{
max-width:100%;
display:block;
}

/* CABECERA */

header{
position:sticky;
top:0;
z-index:1000;
background:rgba(255,255,255,.97);
backdrop-filter:blur(10px);
border-bottom:1px solid var(--borde);
}

.nav{
max-width:1180px;
margin:auto;
padding:12px 20px;
display:flex;
align-items:center;
justify-content:space-between;
gap:18px;
}

.brand{
display:flex;
align-items:center;
gap:9px;
color:var(--azul);
font-weight:800;
font-size:18px;
}

.brand-mark{
font-size:30px;
}

.menu{
display:flex;
gap:13px;
flex-wrap:wrap;
justify-content:flex-end;
}

.menu a{
font-size:13px;
font-weight:700;
color:#31545b;
padding:7px 3px;
}

.menu a:hover{
color:var(--azul2);
}

/* HERO */

.hero{
color:white;
background:
linear-gradient(120deg,rgba(3,54,69,.95),rgba(6,126,140,.82)),
url('IMG-20260511-WA0085.jpg') center/cover;
padding:95px 20px 90px;
}

.hero-inner{
max-width:1180px;
margin:auto;
}

.eyebrow{
text-transform:uppercase;
letter-spacing:2px;
font-size:13px;
font-weight:800;
}

.hero h1{
font-size:clamp(48px,8vw,88px);
line-height:.98;
margin:15px 0 20px;
}

.hero h1 span{
color:#aee8dd;
}

.hero p{
font-size:clamp(19px,3vw,27px);
max-width:850px;
}

.hero .lead{
font-size:17px;
max-width:760px;
margin-top:18px;
}

.btn{
display:inline-block;
margin-top:25px;
padding:13px 22px;
border-radius:30px;
background:white;
color:var(--azul);
font-weight:800;
}

.btn.dark{
background:var(--azul);
color:white;
}

.hero-badges{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:25px;
}

.badge{
padding:8px 13px;
border:1px solid rgba(255,255,255,.35);
border-radius:30px;
background:rgba(255,255,255,.12);
font-weight:700;
font-size:13px;
}

/* MENU RAPIDO */

.quick{
max-width:1180px;
margin:-34px auto 0;
padding:0 20px;
position:relative;
}

.quick-grid{
background:white;
border-radius:22px;
box-shadow:var(--sombra);
display:grid;
grid-template-columns:repeat(8,1fr);
overflow:hidden;
}

.quick a{
padding:18px 8px;
text-align:center;
border-right:1px solid #e5efee;
font-size:12px;
font-weight:800;
color:var(--azul);
}

.quick a:last-child{
border:0;
}

.quick i{
display:block;
font-style:normal;
font-size:27px;
margin-bottom:4px;
}

/* SECCIONES */

.section{
max-width:1180px;
margin:auto;
padding:75px 20px;
}

.section.alt{
background:var(--agua);
}

.section-head{
max-width:850px;
margin-bottom:34px;
}

.section h2{
font-size:clamp(30px,5vw,44px);
line-height:1.1;
color:var(--azul);
margin-bottom:14px;
}

.section
